<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Test bet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/style.min.css?v=12">
  <link rel="stylesheet" href="/sporting/css/sporting.css">
</head>
<body>
  <header class="sporting-header">
    <div class="sporting-header__inner">
      <a href="/sporting/" class="sporting-brand">
        <span class="sporting-brand__title"><i class="fas fa-futbol"></i> Test bet</span>
      </a>
      <button type="button" class="sporting-theme-btn" id="sporting-theme-btn" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
      </button>
      <button type="button" class="sporting-nav-toggle" id="sporting-nav-toggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="sporting-nav" id="sporting-nav-menu">
        <a href="/">Home</a>
        <a href="/sporting/">Sports</a>
        <a href="/sporting/login.html" class="active">Login</a>
        <a href="/sporting/register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="sporting-page">
    <div class="sporting-container" style="max-width:420px;">
      <section class="sporting-hero">
        <h1>Welcome Back</h1>
        <p>Sign in to your Test bet account</p>
      </section>

      <div class="sporting-card">
        <div id="form-errors" class="form-errors" hidden></div>
        <form id="login-form" class="sporting-form" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="sporting-btn sporting-btn--primary" style="width:100%;" id="login-btn">
            Sign In
          </button>
        </form>
      </div>

      <p style="text-align:center;margin-top:16px;">
        No account? <a href="/sporting/register.html" style="color:var(--cctn-orange);">Register</a>
      </p>
    </div>
  </main>

  <script src="/sporting/js/api.js"></script>
  <script src="/sporting/js/nav.js"></script>
  <script src="/sporting/js/login.js"></script>
</body>
</html>
